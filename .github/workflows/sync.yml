name: Sync plugin index

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [plugin-release]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install validator
        run: npm install --no-audit --no-fund

      - name: Sync index with the latest plugin release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sync-index.mjs

      - name: Validate
        run: npm run validate

      - name: Commit the new version
        run: |
          if git diff --quiet -- index.json; then
            echo "index.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "chore: sync dsh-scnet-plan release"
          git push
